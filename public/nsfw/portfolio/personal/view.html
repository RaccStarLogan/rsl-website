  <main>
    <div class="image-container">
      <h2 id="title"></h2>
      <img src="" alt="Viewing Image" id="viewed-image" />
      <p id="desc"></p>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const date = params.get("date");

      if (!date) {
        document.querySelector("main").innerHTML =
          "<p>Invalid link or missing parameters.</p><button onclick='window.history.back()'>⬅ Go Back</button>";
      } else {
        const folder = date;
        const image = document.getElementById("viewed-image");
        const base = `https://media.raccstarlogan.com/nsfw/portfolio/personal/${folder}/img`;

        // Image fallback chain (NO fetch -> no CORS issues)
        image.onerror = () => {
          if (image.src.endsWith(".webp")) image.src = `${base}.png`;
          else if (image.src.endsWith(".png")) image.src = `${base}.jpg`;
          else if (image.src.endsWith(".jpg")) image.src = `${base}.jpeg`;
          else {
            image.src = "/placeholder.png";
            image.alt = "Image not found.";
          }
        };
        image.src = `${base}.webp`;

        // Metadata stays on your main site
        const metaBase = `/portfolio/personal/${folder}`;
        const titleFile = `${metaBase}/title.txt`;
        const descriptionFile = `${metaBase}/desc.md`;

        fetch(titleFile)
          .then((res) => res.text())
          .then((data) => {
            if (data.includes("<!DOCTYPE html>")) throw new Error("Title is fallback HTML");
            document.title = `${data} - View - RaccStarLogan`;
            document.getElementById("title").innerText = data;
          })
          .catch((err) => {
            console.error("Error loading title:", err);
            document.title = "Untitled - View - RaccStarLogan";
          });

        fetch(descriptionFile)
          .then((res) => res.text())
          .then((md) => {
            if (md.includes("<!DOCTYPE html>")) throw new Error("Description is fallback HTML");
            document.getElementById("desc").innerHTML = marked.parse(md);
          })
          .catch((err) => {
            console.error("Error loading description:", err);
            document.getElementById("desc").innerText = "No description available.";
          });

        // Nav buttons
        fetch(`/portfolio/personal/dates.json`)
          .then((res) => res.json())
          .then((dates) => {
            const currentIndex = dates.indexOf(date);
            if (currentIndex === -1) return;

            const prevDate = dates[currentIndex - 1];
            const nextDate = dates[currentIndex + 1];

            const prevBtn = document.getElementById("prev-btn");
            const nextBtn = document.getElementById("next-btn");

            if (prevDate) {
              prevBtn.style.display = "inline-block";
              prevBtn.onclick = () => (window.location.href = `view.html?date=${prevDate}`);
            }

            if (nextDate) {
              nextBtn.style.display = "inline-block";
              nextBtn.onclick = () => (window.location.href = `view.html?date=${nextDate}`);
            }
          })
          .catch((err) => console.error("Error loading navigation buttons:", err));
      }
    </script>
