  <script>

  <script>
    fetch('dates.json')
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status} on ${res.url}`);
        return res.json();
      })
      .then(async (dates) => {
        const container = document.getElementById("gallery-container");
        const grouped = {};

        for (const date of dates.reverse()) {
          const [year] = date.split("/");
          if (!grouped[year]) grouped[year] = [];
          grouped[year].push(date);
        }

        for (const year of Object.keys(grouped).sort((a, b) => b - a)) {
          const yearHeader = document.createElement("h2");
          yearHeader.textContent = year;
          yearHeader.style.textAlign = "center";
          container.appendChild(yearHeader);

          const grid = document.createElement("div");
          grid.className = "gallery-grid";
          container.appendChild(grid);

          for (const date of grouped[year]) {
            const folder = `${date}`;
            const encodedDate = encodeURIComponent(date);
            const thumbPath = `${folder}/thumb.jpg`;
            const titlePath = `${folder}/title.txt`;

            let title = date;
            try {
              const titleRes = await fetch(titlePath);
              const titleText = await titleRes.text();
              if (!titleText.includes("<!DOCTYPE")) title = titleText.trim();
            } catch { }

            const item = document.createElement("div");
            item.className = "gallery-item";

            const link = document.createElement("a");
            link.href = `view.html?date=${encodedDate}`;

            const img = document.createElement("img");
            img.src = thumbPath;
            img.alt = title;

            const label = document.createElement("div");
            label.className = "label";
            label.textContent = title;

            link.appendChild(img);
            item.appendChild(link);
            item.appendChild(label);
            grid.appendChild(item);
          }
        }
      })
      .catch((err) => {
        console.error("Failed to load gallery:", err);
      });
  </script>
  <script>
    async function fetchLastCommitDate() {
      const owner = 'RaccStarLogan';
      const repo = 'rsl-website';
      const path = 'public/portfolio/commissions/dates.json';

      try {
        const response = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/commits?path=${path}&per_page=1`
        );
        const commits = await response.json();

        if (commits.length > 0) {
          const commitDate = new Date(commits[0].commit.committer.date);
          document.getElementById('lastUpdated').textContent = toCentral(commitDate);
        } else {
          document.getElementById('lastUpdated').textContent = 'Never';
        }
      } catch (err) {
        console.error('Error fetching commit data:', err);
        document.getElementById('lastUpdated').textContent = 'Error';
      }
    }

    // Convert date to Central Time with daylight savings awareness
    function toCentral(date) {
      // Central Time is UTC-6 standard, UTC-5 with daylight savings
      const centralOffset = -6; // CST base offset
      const utc = date.getTime() + (date.getTimezoneOffset() * 60000);
      const centralDate = new Date(utc + centralOffset * 60 * 60000);

      // Detect daylight savings: compare Jan vs Jul offsets
      const jan = new Date(centralDate.getFullYear(), 0, 1);
      const jul = new Date(centralDate.getFullYear(), 6, 1);
      const stdOffset = Math.max(jan.getTimezoneOffset(), jul.getTimezoneOffset());
      const isDST = centralDate.getTimezoneOffset() < stdOffset;

      if (isDST) centralDate.setHours(centralDate.getHours() + 1); // adjust for CDT

      return formatDate(centralDate, isDST ? 'CDT' : 'CST');
    }

    // Format date like "Month DD, YYYY HH:MM:SS AM/PM CST/CDT"
    function formatDate(date, tz = 'CST') {
      const months = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ];

      const month = months[date.getMonth()];
      const day = String(date.getDate()).padStart(2, '0');
      const year = date.getFullYear();

      let hours = date.getHours();
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;

      return `${month} ${day}, ${year} ${hours}:${minutes}:${seconds} ${ampm} ${tz}`;
    }

    fetchLastCommitDate();
  </script>
